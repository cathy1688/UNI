name = "uni"
main = "src/index.js"
compatibility_date = "2026-09-29"

account_id = "26fbb58220125144d2d1af3a4ae922bb"

# 每小时整点触发 scheduled handler 刷新快照
[triggers]
crons = ["0 * * * *"]

# KV：缓存每小时抓取的数据快照（key = "snapshot"）
[[kv_namespaces]]
binding = "CACHE"
id = "ed5269b343f24cfbb3eb7216edda5128"

# 静态资源目录（wrangler 最新规范）：public/ 下的 index.html 等由 Worker 托管
[assets]
directory = "./public"
run_worker_first = true
