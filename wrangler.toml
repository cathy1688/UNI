name = "uni-dashboard"
main = "src/index.js"
compatibility_date = "2026-09-29"

# 部署前替换为你自己的 Cloudflare 账号 ID（wrangler login 后也可删掉本行使用默认账号）
account_id = "PLACEHOLDER_ACCOUNT_ID"

# 每小时整点触发 scheduled handler 刷新快照
[triggers]
crons = ["0 * * * *"]

# KV：缓存每小时抓取的数据快照（key = "snapshot"）
[[kv_namespaces]]
binding = "CACHE"
id = "PLACEHOLDER_KV_ID"

# 静态资源目录（wrangler 最新规范）：public/ 下的 index.html 等由 Worker 托管
[assets]
directory = "./public"
run_worker_first = true
